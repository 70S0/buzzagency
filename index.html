<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz Agency — Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        @keyframes pulse-bar {
            0% {
                width: 10%;
            }

            50% {
                width: 75%;
            }

            100% {
                width: 100%;
            }
        }

        .animate-progress {
            animation: pulse-bar 2.5s ease-in-out infinite alternate;
        }
    </style>
</head>

<body
    class="bg-[#09090b] text-[#f4f4f5] min-h-screen flex flex-col justify-between p-6 sm:p-12 relative overflow-hidden select-none">

    <!-- Top Header -->
    <header class="flex justify-between items-center w-full max-w-5xl mx-auto">
        <span class="text-sm font-semibold tracking-widest uppercase text-zinc-400">Buzz Agency</span>
        <div class="flex items-center gap-2">
            <span class="relative flex h-2 w-2">
                <span
                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
            </span>
            <span class="text-xs text-zinc-500 font-mono">Building in progress</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-xl mx-auto text-center space-y-8 my-auto">
        <div class="space-y-3">
            <h1 class="text-4xl sm:text-6xl font-bold tracking-tight">
                Crafting something <span
                    class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">remarkable.</span>
            </h1>
            <p class="text-zinc-400 text-sm sm:text-base max-w-md mx-auto">
                We are setting up our new digital space. Launching soon.
            </p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full max-w-xs mx-auto space-y-2">
            <div class="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full bg-zinc-200 rounded-full animate-progress"></div>
            </div>
            <p class="text-[11px] text-zinc-600 font-mono tracking-wider uppercase">Loading experience</p>
        </div>

        <!-- Links / CTA -->

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl mx-auto flex justify-between items-center text-xs text-zinc-600">
        <span>&copy; 2026 Buzz Agency.</span>
        <span>All systems normal</span>
    </footer>

</body>

</html>
